<!DOCTYPE html>
<html>
<head>
    <title>UFC Survey</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav><a href="tierlist.html">Tier List</a> | <a href="contact.html">Contact Form</a></nav>
    <h1>ufc survey</h1>
    <form>
        <label for="name">Name:</label><input type="text" id="name" required>
        <label for="email">Email:</label><input type="email" id="email" required>
        <label for="choice">Which sport is better?</label>
        <select id="choice"><option>UFC</option><option>Boxing</option></select>
        <label>Are the fights good?</label>
        <input type="radio" id="w-yes" name="weekly"><label for="w-yes">of course</label>
        <input type="radio" id="w-no" name="weekly" value="no"><label for="w-no">no</label><br>
        <label for="comm">Comments:</label><textarea id="comm"></textarea>
        <input type="submit" value="Submit Request">
    </form>
</body>
</html>
